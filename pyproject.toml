[project]
name = "osx-echo"
version = "0.1.0"
description = "OSX Echo is a voice assistant that uses whisper.cpp for dictation."
authors = [
    { name = "Martin Vejmelka", email = "vejmelkam@gmail.com" }
]
dependencies = [
    "pyaudio>=0.2.14",
    "pynput>=1.7.7",
]
readme = "README.md"
requires-python = ">= 3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/osx_echo"]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "mypy>=1.17.1",
    "pytest-timeout>=2.4.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
    "ruff>=0.12.8",
]
